<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Orders</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f9f9f9;
    }
    h2 {
      color: #333;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: left;
    }
    th {
      background: #007BFF;
      color: white;
    }
  </style>
</head>
<body>
  <h2>Order List</h2>
  <table id="ordersTable">
    <thead>
      <tr>
        <th>Order ID</th>
        <th>Date</th>
        <th>Username</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Product</th>
        <th>Quantity</th>
        <th>Total Price</th>
      </tr>
    </thead>
    <tbody>
      <!-- Orders will be populated here -->
    </tbody>
  </table>

  <script>
    fetch('/api/orders')
      .then(response => response.json())
      .then(data => {
        const tableBody = document.querySelector('#ordersTable tbody');
        data.forEach(order => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${order.OrderID}</td>
            <td>${new Date(order.OrderDate).toLocaleString()}</td>
            <td>${order.Username}</td>
            <td>${order.Email}</td>
            <td>${order.PhoneNumber}</td>
            <td>${order.ProductName}</td>
            <td>${order.Quantity}</td>
            <td>$${order.Price.toFixed(2)}</td>
          `;
          tableBody.appendChild(row);
        });
      })
      .catch(error => {
        console.error('Error fetching orders:', error);
      });
  </script>
</body>
</html>
