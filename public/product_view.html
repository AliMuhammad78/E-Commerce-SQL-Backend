<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Products</title>
  <link rel="icon" type="image/png" href="ecommerce.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-logo">MyStore</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="Add_user.html">Sign up</a></li>
      <!-- <li><a href="Add_product.html">Add Product</a></li>
      <li><a href="update_product.html">Update Stock</a></li> -->
      <li><a href="product_view.html">View Products</a></li>
    </ul>
  </nav>

  <header class="welcome-section">
    <h1>📦 All Products</h1>
    <p>These are all the products currently in stock.</p>
  </header>

    <h2>All Products</h2>
    <div id="product-list" class="product-list"></div>

  <script>
    fetch('/api/products')
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('product-list');
        data.forEach(product => {
          const card = document.createElement('div');
          card.className = 'product-card';
          card.innerHTML = `
            <h3 class="product-name">${product.ProductName}</h3>
            <p><strong>ProductId:</strong> ₹${product.ProductID}</p>
            <p><strong>Description:</strong> ${product.Description}</p>
            <p><strong>Price:</strong> ${product.Price}</p>
            <p><strong>Stock:</strong> ${product.StockQuantity}</p>
          `;
          container.appendChild(card);
        });
      })
      .catch(err => {
        console.error('Failed to load products:', err);
      });
  </script>

  </body>
  </html>
