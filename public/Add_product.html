<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product</title>
  <link rel="icon" type="image/png" href="ecommerce.png">
  <link rel="stylesheet" href="style.css">
  <style>
    

     
    header .logo {
      font-size: 1.5rem;
      font-weight: bold;
    }

    header .icons {
      display: flex;
      gap: 1rem;
    }

    header .icons i {
      cursor: pointer;
    }

    .container {
      max-width: 600px;
      margin: 3rem auto;
      background-color: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #333;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      margin: 1rem 0 0.5rem;
      color: #555;
    }

    input, textarea {
      padding: 0.7rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      margin-top: 2rem;
      padding: 0.8rem;
      border: none;
      background-color: #28a745;
      color: white;
      font-size: 1rem;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #218838;
    }

    .message {
      margin-top: 1rem;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body data-page="add-product">
  <header>
    <nav class="navbar">
      <div class="nav-logo">MyStore</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="Add_user.html">Sign up</a></li>
        <!-- <li><a href="Add_product.html">Add Product</a></li>
        <li><a href="update_product.html">Update Stock</a></li> -->
        <li><a href="product_view.html">View Products</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h1>Add Product</h1>
    <form id="addProductForm">
        <input type="text" id="productName" placeholder="Product Name" required><br><br>
        <input type="text" id="description" placeholder="Description" required><br><br>
        <input type="number" id="price" placeholder="Price" required><br><br>
        <input type="number" id="stock" placeholder="Stock" required><br><br>
        <button type="submit">Add Product</button>
    </form>
  </main>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById("addProductForm");
    
            form.addEventListener("submit", function (event) {
                event.preventDefault();
    
                const name = document.getElementById("productName").value;
                const description = document.getElementById("description").value;
                const price = document.getElementById("price").value;
                const stock = document.getElementById("stock").value;
    
                fetch("http://localhost:5500/api/add-product", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: name,
                        description: description,
                        price: price,
                        stock: stock
                    })
                })
                .then(response => {
                    if (response.ok) {
                        alert("✅ Product added successfully!");
                        form.reset(); // clear form
                    } else {
                        alert("❌ Failed to add product");
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    alert("❌ Error connecting to backend");
                });
            });
        });
    </script>
    
</body>
</html>
